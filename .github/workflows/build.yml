name: Build EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-commercial.txt

      - name: Generate spec file
        run: |
          python generate_spec.py project_dirs AutomaticRU2526 WorkUserInterfaceManager WorkProjectManager WorkMouseDesign WorkJSONFiles TemplateProject --main-script AutomaticRU2526/manage.py

      - name: Build with PyInstaller
        run: |
          pyinstaller main.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Windows
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MyApp-Windows
          path: ./release-artifacts

      - name: Zip the build folder
        run: |
          cd release-artifacts
          # Создаем архив в папке на уровень выше (в корне воркспейса)
          zip -r ../MyApp-Windows.zip .
          # Для отладки можно вывести список файлов, чтобы убедиться, что архив создан
          ls -la ..

      - name: Create Pre-release (beta tag)
        if: contains(github.ref, '-beta')
        uses: softprops/action-gh-release@v2
        with:
          # Важно: путь указывается ОТНОСИТЕЛЬНО КОРНЯ репозитория.
          # Архив лежит в корне, поэтому просто имя файла.
          files: MyApp-Windows.zip
          generate_release_notes: true
          prerelease: true

      - name: Create Release (stable tag)
        if: ${{ !contains(github.ref, '-beta') }}
        uses: softprops/action-gh-release@v2
        with:
          files: MyApp-Windows.zip
          generate_release_notes: true
          prerelease: false